name: Capture alerts

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Refresh dividend calendar
        run: |
          python dividend_calendar_pipeline.py --daily-update --lookback-days 95 --forward-days 550 --workers 8

      - name: Send weekly capture email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python dividend_alerts.py \
            --horizon-days 7 \
            --capital 1000 \
            --min-success-30d-pct 80 \
            --max-trend-risk 70 \
            --min-yield-real-pct 2 \
            --send-email
